services:
  - type: web
    name: sentinel1-sar-oil-spill-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://pravinthpravinth040-cpu.github.io,http://localhost:8000,http://localhost:8080

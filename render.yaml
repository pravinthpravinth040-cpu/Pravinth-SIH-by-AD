services:
  - type: web
    name: sentinel1-sar-oil-spill-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://pravinthpravinth040-cpu.github.io,https://pravinthpravinth040-cpu.github.io/
      - key: AIS_SOURCE
        value: "Marine Cadastre / NOAA AIS"
      - key: SATELLITE_SOURCE
        value: "Copernicus Sentinel-1"
